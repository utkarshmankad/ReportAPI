openapi: 3.1.0
info:
  title: ReportAPI
  version: "1.0"
  description: >
    Turn raw CSV or JSON data into a narrative report. This reference covers
    only endpoints that are live today — see the Changelog for what's next.
servers:
  - url: /api
paths:
  /report/generate:
    post:
      summary: Generate a report
      description: >
        Generates a narrative report from CSV or JSON data. Works
        unauthenticated (rate-limited demo, 5 requests/day per IP) or
        authenticated via API key, which attributes usage to your account and
        plan quota.
      security:
        - ApiKeyAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: Raw CSV or JSON data, max 20,000 characters.
                  example: "month,revenue\nJan,10000\nFeb,12000\nMar,9000"
      responses:
        "200":
          description: Report generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  narrative:
                    type: string
                  report_id:
                    type: string
                    format: uuid
                    description: Present only for authenticated requests.
                  status:
                    type: string
                    enum: [completed]
                  tokens_used:
                    type: integer
        "400":
          description: Missing or empty "data" field.
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API key has been revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Input exceeds 20,000 characters.
        "429":
          description: Monthly plan quota or anonymous daily limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Report generation failed upstream. Retry.
  /keys:
    get:
      summary: List your API keys
      security:
        - CookieAuth: []
      responses:
        "200":
          description: List of API keys (prefix only — full key is shown once at creation).
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeySummary"
        "401":
          description: Sign in required.
    post:
      summary: Create a new API key
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: production
      responses:
        "200":
          description: Key created. The raw key is only ever shown in this response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: "#/components/schemas/ApiKeySummary"
                  rawKey:
                    type: string
                    example: rpk_sHKD5EerowStgTq3kAWJ5n9KLmWeS-kF
        "400":
          description: Missing "name" field.
        "401":
          description: Sign in required.
  /keys/{id}:
    delete:
      summary: Revoke an API key
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Key revoked.
        "401":
          description: Sign in required.
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Your ReportAPI key, created from the dashboard. Prefixed rpk_.
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >
        Browser session cookie set on login. Used by the dashboard UI itself
        — not intended for external API access, so "try it now" for these
        endpoints only works if you're logged in in this same browser.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
    ApiKeySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
